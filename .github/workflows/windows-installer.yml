name: Build XiaoBaWang Windows Installer (Preview)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'integrations/whatsapp/**'
      - 'integrations/chatwoot/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pyinstaller>=6.12,<7"

      - name: Build self-contained localhost API executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name xiaobawang-backend --paths . `
            --add-data "backend/chat.html;backend" `
            --add-data "backend/index.html;backend" `
            --collect-all qrcode `
            backend/desktop_entry.py
          if (!(Test-Path dist/xiaobawang-backend.exe)) { throw "Backend executable missing" }

      - name: Smoke test packaged backend without any chat accounts
        shell: pwsh
        run: |
          $env:XBW_API_PORT = "3118"
          $env:XBW_DB_PATH = Join-Path $env:RUNNER_TEMP "xbw-smoke.sqlite"
          $env:DRY_RUN = "true"
          $env:XBW_SEND_ENABLED = "false"
          $env:BAILEYS_SEND_ENABLED = "false"
          $proc = Start-Process -FilePath (Resolve-Path "dist/xiaobawang-backend.exe") `
            -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/xbw-api-out.log" `
            -RedirectStandardError "$env:RUNNER_TEMP/xbw-api-err.log"
          try {
            $healthy = $false
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 600
              $proc.Refresh()
              if ($proc.HasExited) { break }
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:3118/health" -TimeoutSec 2
                if ($health.real_sending -eq $false) { $healthy = $true; break }
              } catch {}
            }
            if (!$healthy) {
              Get-Content "$env:RUNNER_TEMP/xbw-api-err.log" -Tail 35 -ErrorAction SilentlyContinue
              throw "Packaged backend startup failed"
            }
            $page = Invoke-WebRequest "http://127.0.0.1:3118/" -UseBasicParsing
            if ($page.Content -notmatch "小霸王") { throw "Packaged chat homepage missing" }
            Write-Host "PASS: packaged Python backend served native chat page"
          } finally {
            $proc.Refresh()
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Install bundled WhatsApp engine
        working-directory: integrations/whatsapp
        shell: pwsh
        run: npm.cmd install --no-audit --no-fund

      - name: Install desktop packaging tools
        working-directory: desktop
        shell: pwsh
        run: npm.cmd install --no-audit --no-fund

      - name: Compile Windows x64 installer
        working-directory: desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm.cmd run dist:win
          $files = @(Get-ChildItem "release" -Filter "XiaoBaWang-Setup-*.exe")
          if ($files.Count -lt 1) { throw "Windows installer was not generated" }
          $files | ForEach-Object { Write-Host ("Installer: " + $_.Name + " (" + $_.Length + " bytes)") }

      - name: Install and launch packaged desktop app (Windows smoke test)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = @(Get-ChildItem "desktop/release" -Filter "XiaoBaWang-Setup-*.exe" | Select-Object -First 1)
          if ($installer.Count -eq 0) { throw "Installer missing" }
          $target = Join-Path $env:RUNNER_TEMP "XiaoBaWangSmoke"
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList @("/S", "/D=$target") -PassThru
          if (!$install.WaitForExit(90000)) {
            Stop-Process -Id $install.Id -Force
            throw "Windows installer took longer than 90 seconds"
          }
          if ($install.ExitCode -ne 0) { throw "Installer returned exit code $($install.ExitCode)" }
          $exe = Join-Path $target "小霸王.exe"
          if (!(Test-Path $exe)) {
            Get-ChildItem $target -Filter "*.exe" -Recurse | Select-Object FullName
            throw "Installed desktop executable is missing"
          }
          $desktop = Start-Process -FilePath $exe -PassThru
          try {
            $healthy = $false
            for($i=0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 750
              $desktop.Refresh()
              if($desktop.HasExited){ break }
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:3100/health" -TimeoutSec 2
                if($response.real_sending -eq $false) { $healthy=$true; break }
              } catch {}
            }
            if(!$healthy) {
              $logs = Join-Path $env:APPDATA "小霸王/logs"
              Write-Host ("Local diagnostics: " + $logs)
              if(Test-Path $logs) {
                Get-ChildItem $logs -File | ForEach-Object {
                  Write-Host ("--- " + $_.Name)
                  Get-Content $_.FullName -Tail 20
                }
              }
              throw "Installed desktop app did not start localhost services"
            }
            Write-Host "PASS: silent Windows installer and packaged Electron app launch"
            Write-Host "PASS: bundled backend is healthy; real message sending remains disabled"
          } finally {
            $desktop.Refresh()
            if(!$desktop.HasExited){Stop-Process -Id $desktop.Id -Force}
          }

      - name: Upload Windows installer (unsigned preview)
        uses: actions/upload-artifact@v4
        with:
          name: XiaoBaWang-Windows-Installer-Preview
          path: desktop/release/XiaoBaWang-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
