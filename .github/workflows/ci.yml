name: XiaoBaWang baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety defaults
        run: |
          grep -qx 'DRY_RUN=true' .env.example
          grep -qx 'XBW_SEND_ENABLED=false' .env.example
          grep -qx 'BAILEYS_SEND_ENABLED=false' .env.example
          test -f README.md
          test -f docs/ROADMAP.md
      - name: Router unit tests
        run: |
          cd router
          python -m unittest -v test_engine.py
      - name: Management API tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest -v backend/test_app.py backend/test_chatwoot.py backend/test_chat_workspace.py
      - name: Telegram adapter syntax
        run: python -m py_compile integrations/telegram/worker.py
      - name: WhatsApp adapter syntax
        run: |
          node --check integrations/whatsapp/bridge.mjs
          node --test integrations/whatsapp/lifecycle.test.mjs integrations/whatsapp/chatstore.test.mjs
      - name: Validate embedded chat frontend JavaScript
        run: |
          python -c "import re,pathlib; s=pathlib.Path('backend/chat.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script>(.*?)</script>',s,re.S); assert len(scripts)==1; pathlib.Path('backend/chat-inline-check.js').write_text(scripts[0],encoding='utf-8')"
          node --check backend/chat-inline-check.js
      - name: Validate Electron desktop runtime syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node -e "const p=require('./desktop/package.json'); if(!p.build.win || !p.build.extraResources)process.exit(1)"
      - name: Install Node bridge dependencies
        working-directory: integrations/whatsapp
        run: npm install --no-audit --no-fund
      - name: Real local HTTP integration smoke test (no external logins)
        run: python scripts/smoke_test.py
      - name: Parse Windows launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/start-windows.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "Windows startup script has valid PowerShell syntax"

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test startup under Windows PowerShell 5.1
        shell: pwsh
        run: |
          ./scripts/windows-launch-smoke.ps1
