name: XiaoBaWang baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety defaults
        run: |
          grep -qx 'DRY_RUN=true' .env.example
          grep -qx 'XBW_SEND_ENABLED=false' .env.example
          grep -qx 'BAILEYS_SEND_ENABLED=false' .env.example
          test -f README.md
          test -f docs/ROADMAP.md
      - name: Router unit tests
        run: |
          cd router
          python -m unittest -v test_engine.py
      - name: Management API tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest -v backend/test_app.py backend/test_chatwoot.py
      - name: Telegram adapter syntax
        run: python -m py_compile integrations/telegram/worker.py
      - name: WhatsApp adapter syntax
        run: |
          node --check integrations/whatsapp/bridge.mjs
          node --test integrations/whatsapp/lifecycle.test.mjs
      - name: Install Node bridge dependencies
        working-directory: integrations/whatsapp
        run: npm install --no-audit --no-fund
      - name: Real local HTTP integration smoke test (no external logins)
        run: python scripts/smoke_test.py
